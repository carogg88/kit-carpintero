<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Prueba de geometría · Calibre Studio</title>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a class="back" href="./" aria-label="Volver al inicio">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        </a>
        <div>
          <h1>Prueba del motor de geometría</h1>
          <p class="muted">Mesa con 8 encastres y cantos redondeados de 3 mm, calculada con OpenCascade en tu dispositivo.</p>
        </div>
      </header>
      <main class="layout">
        <section class="stage" aria-label="Vista 3D de la mesa">
          <div id="loading" class="loading" role="status">Descargando el motor (unos 7 MB la primera vez)…</div>
        </section>
        <aside class="panel" aria-labelledby="res">
          <h2 id="res">Resultados</h2>
          <dl id="results" class="results"></dl>
          <div class="field">
            <label for="joint">Encastre entre patas y faldones</label>
            <select id="joint" disabled></select>
          </div>
          <div class="field">
            <label for="radius">Radio de los cantos (mm)</label>
            <input id="radius" inputmode="decimal" value="3" />
          </div>
          <div class="actions">
            <button id="rebuild" type="button" disabled>Recalcular todo</button>
            <button id="one" type="button" disabled>Recalcular una pata</button>
            <button id="xray" type="button" aria-pressed="false" disabled>Rayos X</button>
          </div>
          <button id="copy" type="button" class="primary" disabled>Copiar resultados</button>
          <p id="copied" class="muted" role="status"></p>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/geometria/main.ts"></script>
  </body>
</html>
